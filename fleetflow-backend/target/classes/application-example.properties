# Example Application Configuration
server.port=9090

# Database Configuration
# Set these environment variables or update values below:
# DB_URL=jdbc:postgresql://localhost:5432/fleetflow
# DB_USERNAME=your_db_username
# DB_PASSWORD=your_db_password
# JWT_SECRET=your_secret_key_at_least_256_bits_long

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fleetflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:ReplaceWithYourSecretKeyForJWTTokenGeneration32BytesMin}
jwt.expiration-ms=86400000
