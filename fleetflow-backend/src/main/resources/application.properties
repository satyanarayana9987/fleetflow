# FleetFlow Spring Boot Configuration
server.port=9090

# Database Configuration (PostgreSQL with Environment Variable Overrides)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fleetflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JSON & Jackson Settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c8e0d2b4a6f8c1d3e5a7b9c1d3e5a7b9c1d3e5a7b9c1d3e}
jwt.expiration-ms=86400000

# OpenAPI / Swagger Config
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
